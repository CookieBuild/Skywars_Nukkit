name: SkyWars
version: '${version}'
main: com.cookiebuild.skywars.SkyWars
api-version: '26.1.2'
load: POSTWORLD
depend: [CookieDough]

commands:
  skywars:
    description: Join a SkyWars match
    usage: /skywars play
    aliases: [sw]
    permission: skywars.play
  swkit:
    description: Select or unlock a balanced SkyWars kit
    usage: /swkit [select|buy] [scout|armorer|builder|healer]
    permission: skywars.play

permissions:
  skywars.play:
    description: Join Cookie Build SkyWars
    default: true
